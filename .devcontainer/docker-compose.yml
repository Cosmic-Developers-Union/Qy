services:
  devcontainer:
    image: ${DEVCONTAINER_IMAGE-qy_devcontainer-devcontainer:latest}
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        APT_CACHE_PROXY: ${DEVCONTAINER_APT_CACHE_PROXY:-}
        BUN_REGISTRY: ${DEVCONTAINER_BUN_REGISTRY-http://host.docker.internal:4873}
        HTTP_PROXY: ${DEVCONTAINER_HTTP_PROXY-http://host.docker.internal:1080}
        HTTPS_PROXY: ${DEVCONTAINER_HTTPS_PROXY-http://host.docker.internal:1080}
        NO_PROXY: ${DEVCONTAINER_NO_PROXY-localhost,127.0.0.1,::1,host.docker.internal}
        USERNAME: ${USER:-vscode}
        http_proxy: ${DEVCONTAINER_HTTP_PROXY-http://host.docker.internal:1080}
        https_proxy: ${DEVCONTAINER_HTTPS_PROXY-http://host.docker.internal:1080}
        no_proxy: ${DEVCONTAINER_NO_PROXY-localhost,127.0.0.1,::1,host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BUN_INSTALL: /home/${USER:-vscode}/.bun
      BUN_INSTALL_CACHE_DIR: /home/${USER:-vscode}/.bun/install/cache
      BUN_REGISTRY: ${DEVCONTAINER_BUN_REGISTRY-http://host.docker.internal:4873}
      GOROOT: /usr/local/go
      GOPATH: /home/${USER:-vscode}/go
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.google.cn
      GOTOOLCHAIN: local
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      LLVM_CONFIG: llvm-config
      NPM_CONFIG_REGISTRY: ${DEVCONTAINER_BUN_REGISTRY-http://host.docker.internal:4873}
      NO_PROXY: ""
      QY_CC: clang
      QY_LLVM_DIR: /usr/bin
      QY_LLC: llc
      REMOTE_USER: ${USER:-vscode}
      WORKSPACE_FOLDER: /workspaces/Qy
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""
      npm_config_registry: ${DEVCONTAINER_BUN_REGISTRY-http://host.docker.internal:4873}
      UV_LINK_MODE: copy
    volumes:
      - ..:/workspaces/Qy:cached
      - dev-venv:/workspaces/Qy/.venv
      - dev-node-modules:/workspaces/Qy/node_modules
      - dev-bun:/home/${USER:-vscode}/.bun
      - dev-go:/home/${USER:-vscode}/go
      - zsh-history:/home/${USER:-vscode}/.zsh_history
      - type: bind
        source: ${HOME}/.claude
        target: /home/${USER:-vscode}/.claude
        consistency: cached
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.claude.json
        target: /home/${USER:-vscode}/.claude.json
        read_only: true
        consistency: cached
        bind:
          create_host_path: false
    command: sleep infinity
volumes:
  dev-bun:
  dev-go:
  dev-venv:
  dev-node-modules:
  zsh-history:
  zshrc:
