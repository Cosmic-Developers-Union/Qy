name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Set up bun（TypeScript 宿主）
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # lint + format check + type check + full pytest + TS 宿主一致性，与本地 `make ci` 同一条命令
      - name: Lint, type check and test
        run: make ci
